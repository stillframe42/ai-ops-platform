# kube-prometheus-stack values (5주차 Phase 2) — compose 모니터링 스택 이전 대응:
#   prometheus.yml 전역 주기 → prometheusSpec / alertmanager.yml → alertmanager.config
#   grafana 익명 접근 env → grafana.ini / 대시보드 JSON → sidecar ConfigMap (install.sh 가 생성)
# 스크레이프 대상(target-app·control-plane)은 Phase 3 ServiceMonitor 로 이전 — 여기 없음

grafana:
  grafana.ini:
    # 데모 편의 — 로그인 없이 접근 (compose GF_AUTH_* 승계, 실 운영 금지 설정)
    auth.anonymous:
      enabled: true
      org_role: Admin
    auth:
      disable_login_form: true
  additionalDataSources:
    # Loki 데이터소스 — uid 는 compose provisioning 과 동일하게 (대시보드 JSON 참조 정합)
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100

alertmanager:
  config:
    # compose alertmanager.yml 승계 — 수신자 주소만 K8s Service DNS 로 전환.
    # 주의: route 는 map 병합·receivers 는 리스트 전체 대체 — 차트 기본 하위 라우트(Watchdog→"null")가
    # 살아남으므로 "null" 수신자와 하위 라우트를 함께 명시해야 한다 (누락 시 undefined receiver 로 반영 실패)
    route:
      receiver: control-plane-webhook
      group_by: [alertname]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 30m
      routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
    receivers:
      # send_resolved: 해소 통지로 fingerprint 활성 해제 (ADR-0003 승계)
      - name: control-plane-webhook
        webhook_configs:
          - url: http://control-plane.aiops.svc.cluster.local:8080/webhook/alertmanager
            send_resolved: true
      - name: "null"

prometheus:
  prometheusSpec:
    # compose prometheus.yml 전역값 승계
    scrapeInterval: 15s
    evaluationInterval: 15s
    # release 라벨 없는 PrometheusRule·ServiceMonitor(자작·aiops namespace)도 선택하게
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

# Docker Desktop 기반 kind 에서 마운트 전파 문제로 실패가 잦고,
# 시나리오 판정은 앱 메트릭 기반이라 노드 메트릭 불요 — 비활성
nodeExporter:
  enabled: false
