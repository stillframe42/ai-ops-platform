# Loki values (5주차 Phase 2) — compose 의 "기본 내장 config" 상당 최소 구성 (ADR-0004 범위 유지):
# monolithic(SingleBinary) + 파일시스템 저장 + 보존 기본값. 부속(캐시·게이트웨이·카나리)은 데모에 불요라 비활성
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

singleBinary:
  replicas: 1
  persistence:
    size: 2Gi

# SingleBinary 외 모드 구성요소 전부 0/비활성
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
