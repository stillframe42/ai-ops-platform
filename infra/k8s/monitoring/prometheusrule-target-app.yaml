# target-app Alert Rule 의 PrometheusRule 이전 (infra/prometheus/rules/target-app-alerts.yml 원본).
# 임계값 스펙은 docs/scenarios.md — heap 임계는 이월 검토 결과 75% 로 하향 (8/10 결정,
# S3 실측 "85% 발화 후 46초 OOM" — 분석·승인·조치 리드타임 확보. compose 룰도 동기 수정).
# 표현식의 job 라벨은 Phase 3 ServiceMonitor 의 Service 명과 일치해야 한다 (target-app)
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: target-app-alerts
  namespace: monitoring
  labels:
    app: aiops
spec:
  groups:
    - name: target-app
      rules:
        # 시나리오 1: p95 latency ≥ 3초가 5분 지속 + 최소 표본(판정 창 요청 ≥ 30건)
        - alert: TargetAppHighLatency
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_server_requests_seconds_bucket{job="target-app", uri=~"/products.*"}[1m]))
            ) >= 3
            and
            sum(increase(http_server_requests_seconds_count{job="target-app", uri=~"/products.*"}[5m])) >= 30
          for: 5m
          labels:
            severity: warning
            scenario: latency-surge
          annotations:
            summary: "target-app p95 latency 임계값 초과"
            description: "비즈니스 API p95 latency 가 3초 이상으로 5분간 지속 (현재 {{ $value | printf \"%.2f\" }}s)"

        # 시나리오 2: 5xx 비율 ≥ 10% 가 3분 지속 + 최소 표본
        - alert: TargetAppHighErrorRate
          expr: |
            (
              sum(rate(http_server_requests_seconds_count{job="target-app", uri=~"/products.*", status=~"5.."}[1m]))
              /
              sum(rate(http_server_requests_seconds_count{job="target-app", uri=~"/products.*"}[1m]))
            ) >= 0.10
            and
            sum(increase(http_server_requests_seconds_count{job="target-app", uri=~"/products.*"}[3m])) >= 30
          for: 3m
          labels:
            severity: critical
            scenario: error-rate-surge
          annotations:
            summary: "target-app 5xx 비율 임계값 초과"
            description: "비즈니스 API 5xx 비율이 10% 이상으로 3분간 지속 (현재 {{ $value | humanizePercentage }})"

        # 순간 위험 안전망 — 시나리오 3의 추세 감지는 에이전트 담당 (ADR-0003 역할 분담).
        # 임계 75%: 85% 는 발화→OOM 46초 (S3 실측)라 대응 여유 부족
        - alert: TargetAppHeapUsageHigh
          expr: |
            sum(jvm_memory_used_bytes{job="target-app", area="heap"})
            /
            sum(jvm_memory_max_bytes{job="target-app", area="heap"} > 0)
            > 0.75
          for: 1m
          labels:
            severity: critical
            scenario: memory-pressure
          annotations:
            summary: "target-app JVM heap 사용률 75% 초과"
            description: "heap 사용률 {{ $value | humanizePercentage }} — OOM 위험. 추세 분석은 에이전트 보고서 참조"
