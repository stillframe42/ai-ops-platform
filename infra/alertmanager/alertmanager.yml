route:
  receiver: control-plane-webhook
  group_by: [alertname]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 30m
  routes:
    # 품질 SLO(kind=quality)는 추세 알림 — 30분마다 재통지하면 같은 메시지가 채널을 덮는다 (2026-09-14 실측). 발화·해소는 그대로, 재통지만 하루 1회
    - receiver: control-plane-webhook
      matchers:
        - kind = "quality"
      repeat_interval: 24h

receivers:
  # Alert → control-plane webhook → 정규화·멱등 처리 → Kafka ops.incidents 발행 (DAY 17, ADR-0003 완결).
  # send_resolved: 해소 통지로 fingerprint 활성 해제 — 재발화가 새 인시던트로 분리되는 근거
  - name: control-plane-webhook
    webhook_configs:
      - url: http://control-plane:8080/webhook/alertmanager
        send_resolved: true
        # 공유 시크릿 bearer (ADR-0016) — control-plane 의 ALERTMANAGER_WEBHOOK_SECRET 과 같은 값 (파일 마운트, compose.monitoring 참고)
        http_config:
          authorization:
            credentials_file: /etc/alertmanager/webhook-secret
