# OTel Collector (compose) — 앱 4종(agent-service·llm-gateway·control-plane·evaluation-service)의 단일 수신처 (docs/otel-genai-mapping.md §2·§5).
# 백엔드 라우팅은 이 파일에서만 결정한다: 앱은 Collector 주소만 알고, 백엔드 교체·추가는 여기 exporter 변경으로 끝난다.
# K8s 판은 charts/aiops/values.yaml 의 opentelemetry-collector.config — Langfuse exporter 유무만 다르다 (compose 전용 백엔드).

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  # Langfuse OTLP 수신 인증 — Basic(public:secret). 키는 compose.langfuse.yml 초기 프로젝트 키와 같은 원천(infra/.env)
  basicauth/langfuse:
    client_auth:
      username: ${env:LANGFUSE_PUBLIC_KEY}
      password: ${env:LANGFUSE_SECRET_KEY}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 256
    spike_limit_mib: 64
  batch: {}
  # Spring AI 2.0.0 은 프로바이더를 구세대 키(gen_ai.system)로 발신 — 표준 최신 키를 복제한다 (원본 유지, §5)
  transform/normalize:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["gen_ai.provider.name"], attributes["gen_ai.system"]) where attributes["gen_ai.system"] != nil and attributes["gen_ai.provider.name"] == nil
          # Spring AI 는 finish_reasons 를 JSON 문자열('["tool_use"]')로 발신 — Python 계측(배열)과 타입을 맞춘다. 값 어휘는 프로바이더 원어 유지 (§5)
          - set(attributes["gen_ai.response.finish_reasons"], ParseJSON(attributes["gen_ai.response.finish_reasons"])) where IsString(attributes["gen_ai.response.finish_reasons"]) and IsMatch(attributes["gen_ai.response.finish_reasons"], "^\\[")
  # 프롬프트·응답 본문은 Tempo 에 남기지 않는다 — 캡처 지점이 게이트웨이 마스킹보다 앞이라 원문이다 (§6). Langfuse 경로만 유지
  transform/strip-content:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "gen_ai.input.messages")
          - delete_key(attributes, "gen_ai.output.messages")
          - delete_key(attributes, "gen_ai.system_instructions")
  # Langfuse 는 agent-service 스팬만 받는다 — 같은 LLM 호출이 게이트웨이(Spring AI) 스팬으로도 나오므로 비용 이중 집계 방지 (§5).
  # Kafka 소비·발행 스팬({topic} process/send)도 제외 — LLM 관점 밖이고, 아래 루트 승격 뒤 부모 없는 고아 trace 로 남는다
  filter/agent-only:
    error_mode: ignore
    traces:
      span:
        - resource.attributes["service.name"] != "agent-service"
        - IsMatch(name, "^ops\\..* (process|send)$")
  # Langfuse 는 trace 이름·세션(gen_ai.conversation.id)을 **루트 스팬**에서 읽는다. Kafka 전파 이후 워크플로 스팬의 부모는
  # control-plane(미수신)이라 Langfuse 가 루트 없는 trace 로 취급해 세션이 비었다 (2026-09-08 실측). Langfuse 경로에서만
  # 워크플로 스팬의 부모를 지워 루트로 만든다 — Tempo 경로는 원본 그대로 (한 traceId 유지)
  transform/langfuse-root:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(parent_span_id, SpanID(0x0000000000000000)) where name == "invoke_workflow incident-response"

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # otlp_http 는 endpoint 뒤에 /v1/traces 를 붙인다 → Langfuse 의 /api/public/otel/v1/traces (3.222.0 실측 2026-09-03)
  otlp_http/langfuse:
    endpoint: http://langfuse-server:3000/api/public/otel
    auth:
      authenticator: basicauth/langfuse
  # gen_ai 메트릭(토큰·지연)·aiops.evaluation.score(평가 히스토그램)를 Prometheus 가 스크레이프 — pull 모델 일관 (remote write 미사용, §2)
  prometheus:
    endpoint: 0.0.0.0:8889
    # service.name 등 리소스 속성을 라벨로 — 대시보드의 서비스 축
    resource_to_telemetry_conversion:
      enabled: true
  # 로그 시그널 → Loki OTLP 수신 (3.x 기본 활성, /otlp/v1/logs). 지금 유일한 발신은 evaluation-service 의
  # gen_ai.evaluation.result 이벤트 (docs/quality-evaluation.md §6) — 앱 로그 자체는 Alloy 가 컨테이너 stdout 을 긁는 경로 그대로
  otlp_http/loki:
    endpoint: http://loki:3100/otlp

service:
  extensions: [health_check, basicauth/langfuse]
  # Collector 자체 메트릭(수신·전송 실패·큐 드롭 카운터) — 기본은 컨테이너 안 localhost:8888 이라 밖에서 못 읽는다. 차트 판(MY_POD_IP)과 대칭
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces/tempo:
      receivers: [otlp]
      processors: [memory_limiter, transform/normalize, transform/strip-content, batch]
      exporters: [otlp_grpc/tempo]
    traces/langfuse:
      receivers: [otlp]
      processors: [memory_limiter, filter/agent-only, transform/langfuse-root, batch]
      exporters: [otlp_http/langfuse]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]
