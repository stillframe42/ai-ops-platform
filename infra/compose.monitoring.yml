# 모니터링 스택 조각 — 루트 docker-compose.yml 의 include 로 병합된다 (단독 실행 금지).
# 분할 기준: ADR-0001 추가 사항 (2026-07-26) — 진입점은 단일, 파일만 기능별 분리

# YAML 앵커는 파일 경계를 넘지 못한다 — 루트의 x-logging 과 동일 내용 복제 (변경 시 4파일 동기)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Alert Rule 수정 시 재기동 없이 POST /-/reload 로 반영하기 위함
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    ports:
      # 9090 은 ai-code-reviewer 스택의 Prometheus 가 점유 — 충돌 회피
      - "9091:9090"
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.33.1
    container_name: alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # 웹훅 공유 시크릿 (ADR-0016) — Alertmanager 는 설정에서 env 를 못 읽어 파일로 전달.
      # git 미추적: infra/.env 의 ALERTMANAGER_WEBHOOK_SECRET 값을 `printf '%s' "$값" > infra/alertmanager/webhook-secret` 로 생성
      - ./alertmanager/webhook-secret:/etc/alertmanager/webhook-secret:ro
    ports:
      - "9093:9093"
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.1.0
    container_name: grafana
    environment:
      # 데모 편의 — 로그인 없이 접근 (실 운영 금지 설정, 비목표: 실 사용자 없음)
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      # 3000/3001 은 ai-code-reviewer 스택(Langfuse/Grafana)이 점유 — 충돌 회피
      - "3002:3000"
    logging: *default-logging

  loki:
    # 기본 내장 config 가 곧 ADR-0004 범위 (monolithic + 파일시스템 + 보존 기본값)
    image: grafana/loki:3.7.3
    container_name: loki
    ports:
      - "3100:3100"
    logging: *default-logging

  alloy:
    # 로그 수송: 컨테이너 stdout → Alloy(docker discovery) → Loki (ADR-0004 추가 사항 참조)
    image: grafana/alloy:v1.17.1
    container_name: alloy
    command:
      - run
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    logging: *default-logging
