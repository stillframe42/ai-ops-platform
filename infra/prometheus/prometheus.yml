global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: target-app
    metrics_path: /actuator/prometheus
    # 데모 시연 시간 단축을 위해 기본(15s)보다 촘촘하게
    scrape_interval: 5s
    static_configs:
      - targets: ["target-app:8080"]

  # MCP 도구 호출 계측 (DAY 17) — mcp_tool_calls_* (tool/outcome 태그)
  - job_name: control-plane
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["control-plane:8080"]
