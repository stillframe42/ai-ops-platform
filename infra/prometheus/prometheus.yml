global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # 알림 출처 라벨 — compose 와 kind 가 같은 Slack 채널로 보내므로 품질 알림 메시지에 어느 환경인지 싣는다 (charts values externalLabels 와 짝)
  external_labels:
    cluster: compose

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: target-app
    metrics_path: /actuator/prometheus
    # 데모 시연 시간 단축을 위해 기본(15s)보다 촘촘하게
    scrape_interval: 5s
    static_configs:
      - targets: ["target-app:8080"]

  # MCP 도구 호출 계측 (DAY 17) — mcp_tool_calls_* (tool/outcome 태그)
  - job_name: control-plane
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["control-plane:8080"]
  # 게이트웨이 메트릭(gateway.* + Spring AI gen_ai.client.*) — K8s 는 차트 ServiceMonitor 가 담당, compose 는 이 잡 (DAY 44 추가)
  - job_name: llm-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["llm-gateway:8090"]

  # OTel Collector prometheus exporter (DAY 42) — gen_ai_client_token_usage 등 표준 GenAI 메트릭 (pull 모델 일관)
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
