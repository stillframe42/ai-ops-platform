name: ai-ops-platform

# json-file 기본값은 용량 무제한 — 상시 가동 스택이라 디스크 증식 방지 필수.
# Docker 쪽 파일은 최근 버퍼(컨테이너당 최대 30MB), 보존 저장소 역할은 Loki 가 담당.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Langfuse v3 웹/worker 공유 환경 변수 (선언 앵커 — 사용은 각 서비스의 <<).
# 크리덴셜 기본값은 로컬 데모 전용 (실 운영 금지) — 덮어쓰기는 infra/.env
x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-aiops}:${POSTGRES_PASSWORD:-aiops}@postgres:5432/langfuse
  SALT: ${LANGFUSE_SALT:-aiops-demo-salt}
  NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-aiops-demo-nextauth}
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: langfuse-redis
  REDIS_PORT: "6379"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:-miniosecret}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:-miniosecret}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"

services:
  target-app:
    build: ../target-app
    container_name: target-app
    environment:
      # heap 시나리오 데모 결정성: max heap 을 고정해야 85% 룰 발화에 필요한 누수량이 예측 가능
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m"
    ports:
      - "8080:8080"
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Alert Rule 수정 시 재기동 없이 POST /-/reload 로 반영하기 위함
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    ports:
      # 9090 은 ai-code-reviewer 스택의 Prometheus 가 점유 — 충돌 회피
      - "9091:9090"
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.33.1
    container_name: alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.1.0
    container_name: grafana
    environment:
      # 데모 편의 — 로그인 없이 접근 (실 운영 금지 설정, 비목표: 실 사용자 없음)
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      # 3000/3001 은 ai-code-reviewer 스택(Langfuse/Grafana)이 점유 — 충돌 회피
      - "3002:3000"
    logging: *default-logging

  loki:
    # 기본 내장 config 가 곧 ADR-0004 범위 (monolithic + 파일시스템 + 보존 기본값)
    image: grafana/loki:3.7.3
    container_name: loki
    ports:
      - "3100:3100"
    logging: *default-logging

  alloy:
    # 로그 수송: 컨테이너 stdout → Alloy(docker discovery) → Loki (ADR-0004 추가 사항 참조)
    image: grafana/alloy:v1.17.1
    container_name: alloy
    command:
      - run
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    logging: *default-logging

  k6-load:
    # 상시 기본 트래픽 — 비율 기반 트리거의 최소 표본 조건 충족용 (scenarios.md)
    image: grafana/k6:2.1.0
    container_name: k6-load
    command:
      - run
      - /scripts/products-load.js
    volumes:
      - ./load/products-load.js:/scripts/products-load.js:ro
    depends_on:
      - target-app
    # 스크립트 종료/실패 시 재기동해 상시 트래픽 보장
    restart: unless-stopped
    logging: *default-logging

  agent-service:
    build: ../agent-service
    container_name: agent-service
    environment:
      # 컨테이너 내부 네트워크 기준 URL — 로컬 개발 기본값(localhost:9091 등)을 덮어쓴다 (ADR-0002)
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      CHECKPOINT_DB_URL: postgresql://${POSTGRES_USER:-aiops}:${POSTGRES_PASSWORD:-aiops}@postgres:5432/aiops
      LANGFUSE_HOST: http://langfuse-server:3000
    env_file:
      # LLM API 키 등 시크릿 — agent-service 의 git 미추적 .env 재사용 (environment 가 우선)
      - ../agent-service/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  control-plane:
    # 용도: 관제/API/게이트웨이 — 운영 도구 MCP 서버 (Streamable HTTP, ADR-0010).
    # 유사 인시던트 벡터 검색을 위해 postgres(pgvector) 의 controlplane DB 사용 (최초 1회 생성 — postgres 주석)
    build: ../control-plane
    container_name: control-plane
    environment:
      # 시드 인시던트 임베딩 전용 키 (OpenAI) — infra/.env (git 미추적) 에서 보간, 값 미출력
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      POSTGRES_USER: ${POSTGRES_USER:-aiops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiops}
    ports:
      # 8080 은 target-app 이 점유 — control-plane 은 호스트 8081 로
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  postgres:
    # 용도: LangGraph checkpoint 저장소 — Durable Execution (ADR-0009) + control-plane 벡터 검색.
    # 인시던트 처리 중단-재개의 전제라 앱보다 먼저 떠야 한다 (healthcheck + depends_on)
    # pgvector 계열 이미지 — searchSimilarIncidents 벡터 검색용 (2026-07-23 결정, postgres:18 과 같은 major 라 볼륨 호환)
    # DB 분리 목록 (최초 1회 생성 — 볼륨이 이미 있으면 아래 명령):
    #   docker exec postgres createdb -U aiops langfuse
    #   docker exec postgres createdb -U aiops controlplane
    image: pgvector/pgvector:pg18
    container_name: postgres
    environment:
      # 기본값은 로컬 데모 전용 크리덴셜 (실 운영 금지) — DB 는 compose 네트워크 + localhost 에서만 도달 가능.
      # 덮어쓰려면 infra/.env (git 미추적) 또는 셸 환경 변수로 POSTGRES_USER/PASSWORD 지정
      POSTGRES_DB: aiops
      POSTGRES_USER: ${POSTGRES_USER:-aiops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiops}
    volumes:
      # postgres:18 이미지는 PGDATA 가 /var/lib/postgresql/<major>/docker — 상위 경로를 마운트해야 지속
      - postgres-data:/var/lib/postgresql
    ports:
      # 5432 는 호스트 로컬 PostgreSQL 이 점유 — 로컬 개발(uv run) 접근은 5433 으로
      - "5433:5432"
    healthcheck:
      # $$ 는 compose 보간 회피 — 컨테이너 안에서 POSTGRES_USER 환경 변수를 그대로 읽는다
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d aiops"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Langfuse v3 — 용도: LLM 관측·인시던트당 비용 추적 (thread_id = 세션).
  # Phase 0 의 "compose 추가 기각" 결정을 2026-07-21 번복 — 직전 프로젝트 스택
  # 재활용이 상호 결합(서버 버전 종속)을 만들어, 프로젝트별 자체 소유로 전환.
  # v3 필수 구성: 웹 + worker + ClickHouse(트레이스 저장) + MinIO(S3) + Redis.
  # DB 는 기존 postgres 에 langfuse DB 분리 (최초 1회 생성 — postgres 서비스 주석의 createdb 명령)
  # ---------------------------------------------------------------------------
  langfuse-server:
    image: langfuse/langfuse:3
    container_name: langfuse-server
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    ports:
      # 3000~3002 는 점유 (aireviewer Langfuse/Grafana, 본 스택 Grafana) — 3003 사용
      - "3003:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_URL: http://localhost:3003
      # headless 초기화 — 프로젝트/키를 기동 시 시드 (키 값은 infra/.env, git 미추적)
      LANGFUSE_INIT_ORG_ID: aiops
      LANGFUSE_INIT_ORG_NAME: aiops
      LANGFUSE_INIT_PROJECT_ID: ai-ops-platform
      LANGFUSE_INIT_PROJECT_NAME: ai-ops-platform
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      # UI 로그인 계정 (데모 전용 기본값)
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@aiops.local}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-aiops-demo}
    logging: *default-logging

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: langfuse-worker
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    environment:
      <<: *langfuse-env
    logging: *default-logging

  clickhouse:
    # 용도: Langfuse v3 트레이스/관측 데이터 저장소 (OLAP)
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  minio:
    # 용도: Langfuse v3 이벤트/미디어 대형 객체 저장소 (S3 호환).
    # 기동 시 langfuse 버킷 디렉토리를 미리 만들어 별도 버킷 생성 절차 생략
    image: minio/minio:latest
    container_name: minio
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-miniosecret}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  langfuse-redis:
    # 용도: Langfuse v3 큐/캐시 (worker 이벤트 처리)
    image: redis:7-alpine
    container_name: langfuse-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # === 자리만 예약 (활성화 금지) ===
  # Kafka 는 설계 문서(architecture.md/scenarios.md)에 아직 등장하지 않는다.
  # 용도 정의(ADR 또는 scenarios 반영) 없이 주석을 해제하지 말 것 — plans/202607-1w/tasks_20260714.md
  #
  # kafka:
  #   image: apache/kafka:4.1.0

volumes:
  postgres-data:
  clickhouse-data:
  clickhouse-logs:
  minio-data:
