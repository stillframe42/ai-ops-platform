name: ai-ops-platform

# json-file 기본값은 용량 무제한 — 상시 가동 스택이라 디스크 증식 방지 필수.
# Docker 쪽 파일은 최근 버퍼(컨테이너당 최대 30MB), 보존 저장소 역할은 Loki 가 담당.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  target-app:
    build: ../target-app
    container_name: target-app
    environment:
      # heap 시나리오 데모 결정성: max heap 을 고정해야 85% 룰 발화에 필요한 누수량이 예측 가능
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m"
    ports:
      - "8080:8080"
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Alert Rule 수정 시 재기동 없이 POST /-/reload 로 반영하기 위함
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    ports:
      # 9090 은 ai-code-reviewer 스택의 Prometheus 가 점유 — 충돌 회피
      - "9091:9090"
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.33.1
    container_name: alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.1.0
    container_name: grafana
    environment:
      # 데모 편의 — 로그인 없이 접근 (실 운영 금지 설정, 비목표: 실 사용자 없음)
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      # 3000/3001 은 ai-code-reviewer 스택(Langfuse/Grafana)이 점유 — 충돌 회피
      - "3002:3000"
    logging: *default-logging

  loki:
    # 기본 내장 config 가 곧 ADR-0004 범위 (monolithic + 파일시스템 + 보존 기본값)
    image: grafana/loki:3.7.3
    container_name: loki
    ports:
      - "3100:3100"
    logging: *default-logging

  alloy:
    # 로그 수송: 컨테이너 stdout → Alloy(docker discovery) → Loki (ADR-0004 추기 참조)
    image: grafana/alloy:v1.17.1
    container_name: alloy
    command:
      - run
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    logging: *default-logging

  k6-load:
    # 상시 기본 트래픽 — 비율 기반 트리거의 최소 표본 조건 충족용 (scenarios.md)
    image: grafana/k6:2.1.0
    container_name: k6-load
    command:
      - run
      - /scripts/products-load.js
    volumes:
      - ./load/products-load.js:/scripts/products-load.js:ro
    depends_on:
      - target-app
    # 스크립트 종료/실패 시 재기동해 상시 트래픽 보장
    restart: unless-stopped
    logging: *default-logging

  # === 자리만 예약 (활성화 금지) ===
  # PostgreSQL/Kafka 는 설계 문서(architecture.md/scenarios.md)에 아직 등장하지 않는다.
  # 용도 정의(ADR 또는 scenarios 반영) 없이 주석을 해제하지 말 것 — plans/202607-1w/tasks_20260714.md
