name: ai-ops-platform

# 단일 진입점 (ADR-0001) — 실행은 이 파일 하나로: docker compose up.
# 기능별 조각은 include 로 병합 (ADR-0001 추가 사항 2026-07-26 — 파일 분리, 진입점 유지):
#   compose.monitoring.yml  Prometheus/Alertmanager/Grafana/Loki/Alloy
#   compose.langfuse.yml    Langfuse v3 (웹/worker/ClickHouse/MinIO/Redis)
#   compose.kafka.yml       Kafka KRaft 브로커 + 토픽 초기화
# 이 파일에는 핵심 앱(target-app, agent-service, control-plane)과 공유 DB(postgres)만 남긴다.
# 제약: YAML 앵커는 파일 경계를 못 넘는다 — x-logging 은 각 조각에 동일 내용 복제 (변경 시 4파일 동기)
include:
  - compose.monitoring.yml
  - compose.langfuse.yml
  - compose.kafka.yml

# json-file 기본값은 용량 무제한 — 상시 가동 스택이라 디스크 증식 방지 필수.
# Docker 쪽 파일은 최근 버퍼(컨테이너당 최대 30MB), 보존 저장소 역할은 Loki 가 담당.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  target-app:
    build: ../target-app
    container_name: target-app
    environment:
      # heap 시나리오 데모 결정성: max heap 을 고정해야 85% 룰 발화에 필요한 누수량이 예측 가능
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m"
    ports:
      - "8080:8080"
    logging: *default-logging

  k6-load:
    # 상시 기본 트래픽 — 비율 기반 트리거의 최소 표본 조건 충족용 (scenarios.md)
    image: grafana/k6:2.1.0
    container_name: k6-load
    command:
      - run
      - /scripts/products-load.js
    volumes:
      - ./load/products-load.js:/scripts/products-load.js:ro
    depends_on:
      - target-app
    # 스크립트 종료/실패 시 재기동해 상시 트래픽 보장
    restart: unless-stopped
    logging: *default-logging

  agent-service:
    build: ../agent-service
    container_name: agent-service
    environment:
      # 컨테이너 내부 네트워크 기준 URL — 로컬 개발 기본값(localhost:9091 등)을 덮어쓴다 (ADR-0002)
      # 모든 LLM 호출은 llm-gateway 경유 (ADR-0015) — 모델 선택은 게이트웨이 라우팅 소관
      LLM_BASE_URL: http://llm-gateway:8090/v1
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      CHECKPOINT_DB_URL: postgresql://${POSTGRES_USER:-aiops}:${POSTGRES_PASSWORD:-aiops}@postgres:5432/aiops
      # OTLP 트레이스·메트릭 전송 (DAY 42) — Collector 주소만 안다. 백엔드(Tempo·Langfuse·Prometheus)는 otel/collector.yml 소관
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # 프롬프트/응답 본문 캡처 (DAY 43, docs/otel-genai-mapping.md §6) — 로컬 compose 전용. 캡처 지점이 게이트웨이 입력
      # 마스킹보다 앞이라 원문(마스킹 전)이 `gen_ai.input/output.messages` 스팬 속성으로 나간다 → Langfuse 입출력 표시용.
      # Tempo 경로는 Collector transform 이 삭제한다. 운영(K8s)은 미설정 = NO_CONTENT
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: SPAN_ONLY
      # MCP 도구 서버 (DAY 16, ADR-0010) — 컨테이너 내부 네트워크 기준, 로컬 기본값(localhost:8081)을 덮어쓴다.
      # control-plane 에 depends_on 을 걸지 않는다 — 발견 실패 시 로컬 도구 강등(부분 진행)이 설계 경로
      MCP_SERVER_URL: http://control-plane:8080/mcp
      # MCP 인증 토큰 발급 (ADR-0016) — auth-server 컨테이너 주소. 시크릿은 auth-server 등록값과 같은 원천(infra/.env)을
      # 이름만 바꿔 전달 — 미설정이면 compose 자체가 실패한다 (인증 항상 필수: pass-through 의 조용한 미전달을 쓰지 않는다)
      AUTH_TOKEN_URL: http://auth-server:8091/oauth2/token
      AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET_AGENT_SERVICE:?infra/.env 의 AUTH_CLIENT_SECRET_AGENT_SERVICE 필요}
      # Kafka 인시던트 컨슈머 (DAY 18, ADR-0011) — 컨테이너 내부 리스너, 로컬 기본값(localhost:9094)을 덮어쓴다.
      # kafka 에 depends_on 을 걸지 않는다 — 접속 실패는 컨슈머의 백오프 재시도가 흡수 (앱 기동 유지)
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    env_file:
      # LLM API 키 등 시크릿 — agent-service 의 git 미추적 .env 재사용 (environment 가 우선)
      - ../agent-service/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  evaluation-service:
    # 용도: 보고서 품질 지속 검증 (ADR-0019) — ops.analysis.results 를 별도 컨슈머 그룹으로 읽어 샘플링 → 시간창 재조회 →
    # LLM-as-a-Judge(게이트웨이 경유) → ops.evaluation.results. 응답 경로 밖이라 depends_on 을 두지 않는다 —
    # 브로커·관측 스택 미가동은 컨슈머 백오프·근거 없음 처리로 흡수 (agent-service 와 같은 부분 기능 관례)
    build: ../evaluation-service
    container_name: evaluation-service
    environment:
      LLM_BASE_URL: http://llm-gateway:8090/v1
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      AUTH_TOKEN_URL: http://auth-server:8091/oauth2/token
      # 게이트웨이 호출용 클라이언트 시크릿 (ADR-0016) — auth-server 등록값과 같은 원천(infra/.env), 미설정이면 compose 자체가 실패
      AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET_EVALUATION_SERVICE:?infra/.env 의 AUTH_CLIENT_SECRET_EVALUATION_SERVICE 필요}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # 샘플링 프로파일 (docs/quality-evaluation.md §3) — 로컬 데모는 전수 평가
      EVAL_SAMPLE_PROFILE: experiment
    ports:
      - "8001:8000"
    logging: *default-logging

  auth-server:
    # 용도: 서비스 간 OAuth 2.1 토큰 발급 (Client Credentials, ADR-0016) — 리소스 서버(control-plane·llm-gateway)의 issuer.
    # 인증 항상 필수 결정에 따라 로컬(compose)도 이 서비스를 전제한다. 시크릿 4종은 infra/.env pass-through, 미설정 = 기동 실패
    build: ../auth-server
    container_name: auth-server
    environment:
      # 토큰 iss = 컨테이너 네트워크 주소 — 리소스 서버 issuer-uri 와 문자 단위 일치
      AUTH_ISSUER: http://auth-server:8091
      AUTH_CLIENT_SECRET_AGENT_SERVICE:
      AUTH_CLIENT_SECRET_CONTROL_PLANE:
      AUTH_CLIENT_SECRET_OPS_ADMIN:
      AUTH_CLIENT_SECRET_EVALUATION_SERVICE:
    ports:
      - "8091:8091"

  llm-gateway:
    # 용도: 모든 LLM 호출의 단일 관문 (ADR-0015) — 라우팅·캐싱·비용·폴백·한도.
    # 프로바이더 실키는 이 서비스만 보유 — 클라이언트(agent-service·control-plane)는 키 없이 경유.
    # /v1 은 OAuth2 리소스 서버 (llm:invoke, ADR-0016) — JWT issuer 는 docker 프로파일 소유, 시크릿 불필요
    build: ../llm-gateway
    container_name: llm-gateway
    environment:
      # 채팅(Anthropic) 키 — agent-service .env 재사용 (env_file), 임베딩(OpenAI) 키는 infra/.env pass-through
      OPENAI_API_KEY:
      # 게이트웨이 DB(llmgateway — 의미 캐시·비용 원장 공용) 접속 — postgres 와 같은 크리덴셜 원천
      POSTGRES_USER: ${POSTGRES_USER:-aiops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiops}
      # 예산 임계 경고 — control-plane 과 같은 원천(infra/.env) 공유, 미설정 = 로그 대체
      SLACK_WEBHOOK_URL:
    env_file:
      - ../agent-service/.env
    ports:
      - "8090:8090"
    depends_on:
      # 의미 캐시 스키마 초기화·비용 원장 생성이 기동 시점에 DB 를 요구 — redis 는 무캐시 통과라 미의존
      postgres:
        condition: service_healthy

  redis:
    # 용도: llm-gateway 정확 일치 캐시 + 예산 카운터·rate limit 버킷.
    # 공식 이미지 (bitnami 기각 선례) — 의미 캐시는 pgvector 라 검색 모듈 불요.
    # 캐시 전용 무영속 — 소실 시 재계산으로 수렴, LRU 퇴출은 오류 아닌 캐시 미스
    image: redis:8.2-alpine
    container_name: redis
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]

  control-plane:
    # 용도: 관제/API/게이트웨이 — 운영 도구 MCP 서버 (Streamable HTTP, ADR-0010).
    # 유사 인시던트 벡터 검색을 위해 postgres(pgvector) 의 controlplane DB 사용 (최초 1회 생성 — postgres 주석)
    build: ../control-plane
    container_name: control-plane
    # 값 없는 선언 = pass-through (2026-08-07 정리, 8/3 합의): infra/.env 또는 셸 env 에 있으면
    # 전달하고, 미설정이면 변수 자체를 전달하지 않는다 (빈 문자열 아님 — 실측 확인).
    # 기본값 소유는 application.yml 한 곳 — compose 에 기본값을 복제하지 않는다.
    # Kafka 접속 주소는 application-docker.yml 이관 (datasource 선례 — 환경 차이값은 프로파일 소유).
    # kafka 에 depends_on 을 걸지 않는다 — Kafka 다운 시에도 webhook 202 수신은 유지(발행 실패는 로그)가 설계 경로
    environment:
      # 임베딩은 llm-gateway 경유 + OAuth 토큰 (ADR-0016) — 프로바이더 키 불필요. 게이트웨이 호출용 클라이언트 시크릿은
      # auth-server 등록값과 같은 원천(infra/.env)을 이름만 바꿔 전달, 미설정이면 compose 자체가 실패 (인증 항상 필수)
      AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET_CONTROL_PLANE:?infra/.env 의 AUTH_CLIENT_SECRET_CONTROL_PLANE 필요}
      # Alertmanager 웹훅 공유 시크릿 (ADR-0016) — 미설정 = 기동 실패 (인증 항상 필수). JWT issuer·토큰 URL 은 docker 프로파일 소유
      ALERTMANAGER_WEBHOOK_SECRET:
      # Slack Incoming Webhook (DAY 19) — 미설정 시 알림 비활성
      SLACK_WEBHOOK_URL:
      # Slack App 승인 카드·Socket Mode 버튼 수신 (DAY 23, ADR-0006) —
      # 셋 중 하나라도 없으면 승인 Slack 경로만 비활성 (승인 API 는 항상 유효). 채널은 카드를 보낼 채널 ID
      SLACK_BOT_TOKEN:
      SLACK_APP_TOKEN:
      SLACK_APPROVAL_CHANNEL:
      # 승인 타임아웃 정책 (DAY 23, ADR-0006) — 기본값(30m/60m/60s)은 application.yml 소유,
      # 단축값 검증은 셸 env 로 덮어쓴다 (예: APPROVAL_REMIND_AFTER=1m docker compose up -d control-plane)
      APPROVAL_REMIND_AFTER:
      APPROVAL_EXPIRE_AFTER:
      APPROVAL_SWEEP_INTERVAL:
      # DB 크리덴셜 — 기본값(aiops)은 application.yml 소유, postgres 서비스 초기화 값과 같은 원천(.env)을 공유
      POSTGRES_USER:
      POSTGRES_PASSWORD:
    ports:
      # 8080 은 target-app 이 점유 — control-plane 은 호스트 8081 로
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  postgres:
    # 용도: LangGraph checkpoint 저장소 — Durable Execution (ADR-0009) + control-plane 벡터 검색.
    # 인시던트 처리 중단-재개의 전제라 앱보다 먼저 떠야 한다 (healthcheck + depends_on)
    # pgvector 계열 이미지 — searchSimilarIncidents 벡터 검색용 (2026-07-23 결정, postgres:18 과 같은 major 라 볼륨 호환)
    # DB 분리 목록 (최초 1회 생성 — 볼륨이 이미 있으면 아래 명령):
    #   docker exec postgres createdb -U aiops langfuse
    #   docker exec postgres createdb -U aiops controlplane
    #   docker exec postgres createdb -U aiops llmgateway
    image: pgvector/pgvector:pg18
    container_name: postgres
    environment:
      # 기본값은 로컬 데모 전용 크리덴셜 (실 운영 금지) — DB 는 compose 네트워크 + localhost 에서만 도달 가능.
      # 덮어쓰려면 infra/.env (git 미추적) 또는 셸 환경 변수로 POSTGRES_USER/PASSWORD 지정
      POSTGRES_DB: aiops
      POSTGRES_USER: ${POSTGRES_USER:-aiops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiops}
    volumes:
      # postgres:18 이미지는 PGDATA 가 /var/lib/postgresql/<major>/docker — 상위 경로를 마운트해야 지속
      - postgres-data:/var/lib/postgresql
    ports:
      # 5432 는 호스트 로컬 PostgreSQL 이 점유 — 로컬 개발(uv run) 접근은 5433 으로
      - "5433:5432"
    healthcheck:
      # $$ 는 compose 보간 회피 — 컨테이너 안에서 POSTGRES_USER 환경 변수를 그대로 읽는다
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d aiops"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

volumes:
  postgres-data:
