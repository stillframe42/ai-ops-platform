# target-app 단위 테스트 CI (2026-09-02)
name: ci-target-app

on:
  push:
    branches: [main]
    paths:
      - "target-app/**"
      - ".github/workflows/ci-target-app.yml"
  pull_request:
    paths:
      - "target-app/**"
      - ".github/workflows/ci-target-app.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: target-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test
