spring:
  application:
    name: control-plane

  security:
    oauth2:
      resourceserver:
        jwt:
          # 토큰 발급자 (ADR-0016) — auth-server 의 issuer 와 문자 단위 일치, 검증 키는 issuer 의 JWKS 에서 조회.
          # 기본값은 호스트 실행 기준 — docker 프로파일이 컨테이너 주소로 덮어쓴다. 잘못된 값은 401 로 닫힌다 (무인증 상태 없음)
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8091}
          # aud 검사 — llm-gateway 용 토큰이 여기서 통하지 않게 (단일 토큰 다중 aud 의 리소스별 검사)
          audiences: control-plane

  # 주입 RestClient.Builder 공통 타임아웃 (8/19 — SlackNotifier·TargetAppActionExecutor 의
  # 사용처별 requestFactory 조립 중복 제거. Boot 4 현행 키는 clients 복수형)
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 5s

  datasource:
    # 로컬 개발 기본값 — compose postgres 는 호스트 5433 으로 노출 (5432 는 호스트 로컬 PG 점유)
    # 컨테이너 실행 시에는 docker 프로파일이 URL 을 덮어쓴다
    url: jdbc:postgresql://localhost:5433/controlplane
    username: ${POSTGRES_USER:aiops}
    password: ${POSTGRES_PASSWORD:aiops}

  kafka:
    # 로컬 개발 기본값 — compose kafka 의 호스트 리스너(EXTERNAL). 컨테이너 실행 시 env 가 kafka:9092 로 덮어쓴다
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      properties:
        # Kafka 다운 시 send() 가 메타데이터 대기로 백그라운드 스레드를 점유하는 상한 —
        # 기본 60s 는 Alert 폭풍 때 @Async 풀 고갈 위험 (발행 실패는 로그 경로가 설계)
        max.block.ms: 5000
    consumer:
      # 커밋 부재 시에만 발동하는 시작 위치 대비책 — 그룹 생성 전 발행분(control-plane 다운 중
      # 결과 발행)을 건너뛰지 않는다 (agent-service 컨슈머와 같은 근거, 노트 20260725 파생)
      auto-offset-reset: earliest

  jpa:
    hibernate:
      # 스키마 소유는 Flyway (db/migration) — 엔티티는 생성하지 않고 검증만.
      # 엔티티-DDL 불일치를 기동 시점에 잡는 안전망 (JPA 전환 시 유지하기로 한 경계)
      ddl-auto: validate
    # 요청 수명 동안 세션을 열어 두는 OSIV 비활성 — 조회는 리포지토리 안에서 완결된다
    open-in-view: false

  flyway:
    # controlplane DB 는 비어 있지 않다 — pgvector initialize-schema 가 만든 vector_store 가
    # 이미 존재. 기존 상태를 baseline 으로 두고 V1 부터 적용 (Flyway 기본은 비어 있지 않으면 실패)
    baseline-on-migrate: true
    # 기본 baseline 버전은 1 — 그대로면 V1 이 "이미 적용됨"으로 건너뛰어져 테이블이 안 만들어진다
    # (2026-07-27 기동 실측). 0 으로 내려 V1 부터 실적용
    baseline-version: 0

  ai:
    mcp:
      server:
        name: ops-control-plane
        version: 0.0.1
        # Streamable HTTP 고정 — SSE 는 Spring AI 2.0.0 부터 deprecated
        protocol: STREAMABLE

    openai:
      # 임베딩 전용 키 — .env / 환경 변수 (git 미추적, 값 미출력).
      # 기본값 빈 문자열: 키가 없어도 기동은 되고, 검색 도구만 조용히 비활성 (Langfuse 키-게이트 관례)
      api-key: ${OPENAI_API_KEY:}
      # 임베딩 호출은 llm-gateway 경유 (ADR-0015 단일 통과점) — 기본값은 호스트 실행 기준, docker 프로파일이 덮어쓴다.
      # /v1 포함 필수 — 공식 SDK 는 base-url 에 /embeddings 만 덧붙인다 (DAY 31 실측 404)
      base-url: http://localhost:8090/v1
      embedding:
        # 한국어 시드 본문 임베딩 품질 사유로 선택 (2026-07-23 결정).
        # flat 키 필수 — embedding.options.* 는 Spring AI 2.0 에서 deprecated 미바인딩 (DAY 30 실측:
        # 그동안 라이브러리 기본 ada-002 로 임베딩되던 잠복 버그 — 교정 시 vector_store 재적재 필요)
        model: text-embedding-3-small
    # OpenAI 는 임베딩 전용 — 채팅 모델 자동구성 비활성 (LLM 은 agent-service 의 Anthropic)
    model:
      chat: none

    vectorstore:
      pgvector:
        # vector/hstore 확장 + vector_store 테이블 + HNSW 인덱스 자동 생성 (opt-in)
        initialize-schema: true
        # text-embedding-3-small 의 출력 차원
        dimensions: 1536
        index-type: HNSW
        distance-type: COSINE_DISTANCE

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  tracing:
    sampling:
      probability: 1.0

ops:
  webhook:
    # Alertmanager 웹훅 공유 시크릿 (ADR-0016 — Alertmanager 는 OAuth 클라이언트가 아니라 bearer 정적 대조).
    # 기본값 없음: 미설정 = 기동 실패 (인증 항상 필수). 값은 infra/.env 의 ALERTMANAGER_WEBHOOK_SECRET (git 미추적, 값 미출력)
    shared-secret: ${ALERTMANAGER_WEBHOOK_SECRET}
  slack:
    # Incoming Webhook URL (DAY 19) — 빈 값이면 알림 비활성 (Langfuse 키-게이트 관례).
    # URL 자체가 시크릿 — infra/.env 의 SLACK_WEBHOOK_URL 을 compose 가 주입 (git 미추적, 값 미출력)
    webhook-url: ${SLACK_WEBHOOK_URL:}
    # 승인 카드 발송(Bot Token)·Socket Mode 수신(App Token) (DAY 23, ADR-0006) —
    # 기존 Webhook 과 발신 경로 이원화: 버튼·chat.update·스레드는 App 경로만 가능.
    # 셋 중 하나라도 빈 값이면 해당 기능 조용한 비활성 (승인 API 경로는 항상 유효)
    bot-token: ${SLACK_BOT_TOKEN:}
    app-token: ${SLACK_APP_TOKEN:}
    approval-channel: ${SLACK_APPROVAL_CHANNEL:}
  approval:
    # 승인 타임아웃 정책 (ADR-0006): remind-after 경과 시 재알림 1회 → expire-after 경과 시
    # expired 전이 = 조치 미실행 종결. 설정인 이유: 3경로 검증을 단축값으로 실측하기 위함 (30분 실대기 회피)
    remind-after: ${APPROVAL_REMIND_AFTER:30m}
    expire-after: ${APPROVAL_EXPIRE_AFTER:60m}
    sweep-interval: ${APPROVAL_SWEEP_INTERVAL:60s}
  action:
    # 승인 조치 실행 대상 (DAY 24, ADR-0005 — control-plane 대행). 기본값 소유는 여기 한 곳 —
    # 환경 차이(컨테이너 내부 주소)만 application-docker.yml 이 덮어쓴다 (datasource 선례).
    # restart-container 는 수동 조치 안내 문구의 명령 예시에 쓰인다 (자동 재시작 제외 — 2026-08-04 결정)
    target-app-base-url: http://localhost:8080
    restart-container: target-app
  report:
    # Slack 메시지의 상세 링크 기준 주소 — 사람이 브라우저로 여는 링크라 호스트 노출 포트(8081) 기준
    base-url: ${REPORT_BASE_URL:http://localhost:8081}
