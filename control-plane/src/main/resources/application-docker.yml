# Loki 적재용 JSON 구조화 로그 — 로컬 개발(기본 프로파일)은 사람이 읽는 plain 포맷 유지 (target-app 관례)
logging:
  structured:
    format:
      console: ecs

spring:
  datasource:
    # compose 내부 네트워크 기준 — controlplane DB 는 postgres 컨테이너에 분리 생성 (Langfuse 선례)
    url: jdbc:postgresql://postgres:5432/controlplane

  kafka:
    # compose 내부 리스너 — 환경 차이값은 프로파일 소유 (datasource 선례, 2026-08-07 compose env 정리로 이관)
    bootstrap-servers: kafka:9092

  security:
    oauth2:
      resourceserver:
        jwt:
          # 컨테이너 네트워크 기준 issuer — auth-server 의 AUTH_ISSUER 와 같은 값 (K8s Service 명 = compose 컨테이너명)
          issuer-uri: http://auth-server:8091
      client:
        provider:
          auth-server:
            token-uri: http://auth-server:8091/oauth2/token

  ai:
    openai:
      # 임베딩의 llm-gateway 경유 주소 — 컨테이너 내부 네트워크 기준 (K8s Service 명 = compose 컨테이너명 계약)
      base-url: http://llm-gateway:8090/v1

ops:
  action:
    # compose 내부 네트워크 기준 — 조치 실행(chaos/reset)은 컨테이너 이름으로 도달 (DAY 24)
    target-app-base-url: http://target-app:8080

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          # OTLP/HTTP → Collector (DAY 42, docs/otel-genai-mapping.md §2). K8s Service 명 = compose 컨테이너명 계약.
          # 기본 프로파일(로컬 개발)은 미설정 = 스팬 생성만·전송 없음. 백엔드(Tempo·Langfuse)는 Collector 소관
          endpoint: http://otel-collector:4318/v1/traces
