spring:
  application:
    name: llm-gateway

  ai:
    # Phase 1 은 자동구성 선택 속성으로 단일 ChatModel(Anthropic)·단일 EmbeddingModel(OpenAI) —
    # Phase 2 라우팅에서 양쪽 ChatModel 동시 Bean 이 필요해지면 수동 구성으로 전환
    model:
      chat: anthropic
      embedding: openai
    anthropic:
      # 키-게이트 관례: 빈 값이어도 기동은 되고 호출 시점에만 실패 (compose pass-through 승계, 값 미출력)
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        # Spring AI 2.0 은 chat.options.* 가 아니라 chat.* flat 키 (options.* 는 deprecated 미바인딩 —
        # DAY 30 실측: 미바인딩 시 라이브러리 기본 모델(haiku)로 호출되는 조용한 실패)
        # 기본 모델 (ADR-0007) — 요청 본문의 model 이 우선, Phase 2 라우팅 정책이 이 선택을 대체
        model: claude-sonnet-5
        # Anthropic 필수 파라미터 — 요청에 max_tokens 부재 시 기본값
        max-tokens: 2000
    openai:
      # 임베딩 전용 (control-plane 관례 승계 — Phase 5 폴백에서 채팅 교차 사용 예정)
      api-key: ${OPENAI_API_KEY:}
      embedding:
        # flat 키 (embedding.options.* 는 deprecated 미바인딩 — anthropic 과 같은 함정)
        model: text-embedding-3-small

server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
