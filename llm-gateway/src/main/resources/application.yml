spring:
  application:
    name: llm-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          # 토큰 발급자 (ADR-0016) — auth-server 의 issuer 와 문자 단위 일치, 검증 키는 issuer 의 JWKS 에서 조회 (control-plane 과 같은 관례).
          # 기본값은 호스트 실행 기준 — docker 프로파일이 컨테이너 주소로 덮어쓴다. 잘못된 값은 401 로 닫힌다 (무인증 상태 없음)
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8091}
          # aud 검사 — control-plane 전용 토큰(ops:approve 만 등)이 여기서 통하지 않게
          audiences: llm-gateway

  config:
    # 게이트웨이 도메인 정책(gateway.*)은 gateway.yml 로 분리 (8/22) — 이 파일은 프레임워크 배선만.
    # 병합 규칙: import 문서 > 이 파일, application-docker.yml(프로파일) > import 문서
    import: classpath:gateway.yml

  # 주입 RestClient.Builder 공통 타임아웃 (8/19 — 사용처별 requestFactory 조립 중복 제거,
  # Boot 4 현행 키는 clients 복수형: spring.http.client.* 는 4.0 부터 deprecated 실측)
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 5s

  ai:
    # 멀티 프로바이더: model.chat 미지정 = Anthropic·OpenAI 챗 자동구성 동시 활성 —
    # 선택은 라우팅 정책(gateway.routing)이 요청별로 수행
    model:
      embedding: openai
    anthropic:
      # 키-게이트 관례: 빈 값이어도 기동은 되고 호출 시점에만 실패 (compose pass-through 승계, 값 미출력)
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        # Spring AI 2.0 은 chat.options.* 가 아니라 chat.* flat 키 (options.* 는 deprecated 미바인딩 —
        # DAY 30 실측: 미바인딩 시 라이브러리 기본 모델(haiku)로 호출되는 조용한 실패)
        # 기본 모델 (ADR-0007) — 요청 본문의 model 이 우선, 라우팅 정책이 이 선택을 대체
        model: claude-sonnet-5
        # Anthropic 필수 파라미터 — 요청에 max_tokens 부재 시 기본값
        max-tokens: 2000
    openai:
      # 임베딩 전용 키가 아님 — 폴백 체인이 채팅에도 교차 사용 (control-plane 관례 승계)
      api-key: ${OPENAI_API_KEY:}
      embedding:
        # flat 키 (embedding.options.* 는 deprecated 미바인딩 — anthropic 과 같은 함정)
        model: text-embedding-3-small

server:
  port: 8090

management:
  # OTel Resource 에 인스턴스 id (DAY 43) — 없으면 복제본 여럿의 스팬·메트릭을 가를 수 없다 (agent-service 는 SDK 가 HOSTNAME 으로).
  # 컨테이너/pod 의 HOSTNAME, 호스트 실행은 로컬 표시
  opentelemetry:
    resource-attributes:
      service.instance.id: ${HOSTNAME:local}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  tracing:
    sampling:
      # 기본 0.1 을 두면 수집 백엔드 도입 시 trace 의 90% 가 무작위 누락 — 그 시점을 위한 선행 설정
      probability: 1.0
  health:
    redis:
      # 캐시 장애 = 무캐시 통과 설계 — readiness 가 Redis 에 결합되면 캐시 장애가 게이트웨이 전체를
      # 라우팅에서 제외한다 (rate limit 이 Redis 를 필수화하면 재검토)
      enabled: false
