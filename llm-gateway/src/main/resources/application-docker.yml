# Loki 적재용 JSON 구조화 로그 — 로컬 개발(기본 프로파일)은 사람이 읽는 plain 포맷 유지 (control-plane 관례)
logging:
  structured:
    format:
      console: ecs

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # 컨테이너 네트워크 기준 issuer — auth-server 의 AUTH_ISSUER 와 같은 값 (K8s Service 명 = compose 컨테이너명)
          issuer-uri: http://auth-server:8091

  data:
    redis:
      # 정확 일치 캐시 — 클러스터·compose 공통 서비스명
      host: redis

gateway:
  # 게이트웨이 전용 DB (init-job 이 생성) — 의미 캐시(pgvector)·비용 원장 공용
  postgres:
    url: jdbc:postgresql://postgres:5432/llmgateway
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  # 서비스별 분당 한도 — 초과 시 429 + Retry-After, 버킷은 Redis (replica 2 전제)
  ratelimit:
    default-rpm: 30
    service-rpm:
      agent-service: 60
