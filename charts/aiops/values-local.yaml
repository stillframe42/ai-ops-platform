# 로컬(kind) 환경값 — 기본값과 같더라도 재현 절차의 명시 고정 대상만 적는다.
# 앱 이미지는 kind load 로 반입한 태그 (레지스트리 없음 — :local = imagePullPolicy IfNotPresent 전제)
control-plane:
  image:
    repository: aiops/control-plane
    tag: local
  replicas: 1

agent-service:
  image:
    repository: aiops/agent-service
    tag: local
  replicas: 1

target-app:
  image:
    repository: aiops/target-app
    tag: local

auth-server:
  image:
    repository: aiops/auth-server
    tag: local
  replicas: 1

evaluation-service:
  image:
    repository: aiops/evaluation-service
    tag: local
  replicas: 1
