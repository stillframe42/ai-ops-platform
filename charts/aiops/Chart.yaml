# AI Ops Platform umbrella 차트 — 진입점 하나로 전체 스택 (ADR-0001 include 병합의 K8s 판, ADR-0013)
# 설치: helm dependency update charts/aiops && helm install aiops charts/aiops -n aiops --create-namespace -f charts/aiops/values-local.yaml
# namespace 는 aiops 단일 — 릴리스·주소 체계 단순화
apiVersion: v2
name: aiops
description: 멀티 에이전트 AIOps 플랫폼 전체 스택 — 앱 7종 + DB/Kafka/Redis + 모니터링·로그·추적
type: application
version: 0.1.0

dependencies:
  # 자작 차트 10종 (로컬 경로 — 리소스명이 하드코딩이라 릴리스명 무관 = 주소 계약 유지)
  - name: postgres
    version: 0.1.0
    repository: "file://../postgres"
  - name: redis
    version: 0.1.0
    repository: "file://../redis"
  - name: kafka
    version: 0.1.0
    repository: "file://../kafka"
  - name: control-plane
    version: 0.1.0
    repository: "file://../control-plane"
  - name: agent-service
    version: 0.1.0
    repository: "file://../agent-service"
  - name: target-app
    version: 0.1.0
    repository: "file://../target-app"
  - name: k6-load
    version: 0.1.0
    repository: "file://../k6-load"
  - name: llm-gateway
    version: 0.1.0
    repository: "file://../llm-gateway"
  - name: auth-server
    version: 0.1.0
    repository: "file://../auth-server"
  # 보고서 품질 평가 (ADR-0019) — ops.analysis.results 를 별도 컨슈머 그룹으로 읽는 응답 경로 밖 컴포넌트
  - name: evaluation-service
    version: 0.1.0
    repository: "file://../evaluation-service"
  # 외부 차트 5종 — 설치 실측 버전으로 고정 (재현성)
  - name: kube-prometheus-stack
    version: 88.2.0
    repository: "https://prometheus-community.github.io/helm-charts"
  - name: loki
    version: 7.2.0
    repository: "https://grafana.github.io/helm-charts"
  - name: alloy
    version: 1.11.1
    repository: "https://grafana.github.io/helm-charts"
  # 분산 추적 수집 (DAY 42, docs/otel-genai-mapping.md §2) — 앱은 otel-collector 만 바라본다, 백엔드 라우팅은 values 의 config
  - name: opentelemetry-collector
    version: 0.172.0
    repository: "https://open-telemetry.github.io/opentelemetry-helm-charts"
  - name: tempo
    version: 1.24.4
    repository: "https://grafana.github.io/helm-charts"
