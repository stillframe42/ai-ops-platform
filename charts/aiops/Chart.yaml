# AI Ops Platform umbrella 차트 — 진입점 하나로 전체 스택 (ADR-0001 include 병합의 K8s 판, ADR-0013)
# 설치: helm dependency update charts/aiops && helm install aiops charts/aiops -n aiops --create-namespace -f charts/aiops/values-local.yaml
# namespace 는 aiops 단일 — 릴리스·주소 체계 단순화
apiVersion: v2
name: aiops
description: 멀티 에이전트 AIOps 플랫폼 전체 스택 — 앱 6종 + DB/Kafka/Redis + 모니터링·로그
type: application
version: 0.1.0

dependencies:
  # 자작 차트 9종 (로컬 경로 — 리소스명이 하드코딩이라 릴리스명 무관 = 주소 계약 유지)
  - name: postgres
    version: 0.1.0
    repository: "file://../postgres"
  - name: redis
    version: 0.1.0
    repository: "file://../redis"
  - name: kafka
    version: 0.1.0
    repository: "file://../kafka"
  - name: control-plane
    version: 0.1.0
    repository: "file://../control-plane"
  - name: agent-service
    version: 0.1.0
    repository: "file://../agent-service"
  - name: target-app
    version: 0.1.0
    repository: "file://../target-app"
  - name: k6-load
    version: 0.1.0
    repository: "file://../k6-load"
  - name: llm-gateway
    version: 0.1.0
    repository: "file://../llm-gateway"
  - name: auth-server
    version: 0.1.0
    repository: "file://../auth-server"
  # 외부 차트 3종 — 설치 실측 버전으로 고정 (재현성)
  - name: kube-prometheus-stack
    version: 88.2.0
    repository: "https://prometheus-community.github.io/helm-charts"
  - name: loki
    version: 7.2.0
    repository: "https://grafana.github.io/helm-charts"
  - name: alloy
    version: 1.11.1
    repository: "https://grafana.github.io/helm-charts"
