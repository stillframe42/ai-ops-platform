apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-server
  labels:
    {{- include "auth-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: auth-server
  template:
    metadata:
      labels:
        # app 라벨 = Alloy 의 service 라벨 원천 (LogQL 진입점 계약)
        app: auth-server
    spec:
      containers:
        - name: auth-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8091
              name: http
          env:
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.javaToolOptions | quote }}
            - name: AUTH_ISSUER
              value: {{ .Values.issuer | quote }}
          envFrom:
            # AUTH_CLIENT_SECRET_AGENT_SERVICE / _CONTROL_PLANE / _OPS_ADMIN — 미반입 = 기동 실패
            - secretRef:
                name: {{ .Values.existingSecret }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
