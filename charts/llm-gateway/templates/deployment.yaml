apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: llm-gateway
  template:
    metadata:
      labels:
        # app 라벨 = Alloy 의 service 라벨 원천 (LogQL 진입점 계약)
        app: llm-gateway
    spec:
      containers:
        - name: llm-gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8090
              name: http
          # 상태 전부 밖(Redis·PostgreSQL) — replica 증설에 코드 수정 불요 (HA 전제)
          env:
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.javaToolOptions | quote }}
          envFrom:
            # ANTHROPIC·OPENAI — 미반입 키는 키-게이트 비활성 (pass-through 승계)
            - secretRef:
                name: {{ .Values.existingSecret }}
            # POSTGRES_USER/PASSWORD — L2 캐시(pgvector, llmgateway DB) 접속
            - secretRef:
                name: {{ .Values.postgresSecret }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 45
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
