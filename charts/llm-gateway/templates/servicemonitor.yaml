# 게이트웨이 지표 스크레이프 — 대시보드(요청/모델 분포/캐시 히트율/비용)의 수집 경로
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: llm-gateway
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: llm-gateway
  endpoints:
    - port: http
      path: /actuator/prometheus
