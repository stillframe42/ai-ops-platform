{{- if .Values.keda.enabled }}
# Kafka 컨슈머 lag 기반 오토스케일링 (5주차 Phase 6, ADR-0014) — LLM 워크로드는 CPU 가 아니라
# 대기 큐 길이가 수요 신호라는 결정의 구현. KEDA 설치(CRD)가 전제 — 기본 false 게이트라
# KEDA 없는 클러스터에서도 차트는 유효 (빈 클러스터 재현 절차와의 분리)
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: agent-service
  labels:
    {{- include "agent-service.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: agent-service
  # min 1 — scale-to-zero 불가: ops.actions.decisions 컨슈머가 상주해야 승인 재개가 동작
  minReplicaCount: {{ .Values.keda.minReplicas }}
  # max 3 = ops.incidents 파티션 수 (순서 검토 ⑦ — 초과 replica 는 유휴)
  maxReplicaCount: {{ .Values.keda.maxReplicas }}
  pollingInterval: {{ .Values.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod }}
  triggers:
    - type: kafka
      metadata:
        # KEDA operator(keda ns)가 접속하는 주소 — 교차 ns 라 FQDN 필수
        bootstrapServers: kafka.{{ .Release.Namespace }}.svc.cluster.local:9092
        consumerGroup: agent-service
        topic: ops.incidents
        lagThreshold: {{ .Values.keda.lagThreshold | quote }}
{{- end }}
