image:
  repository: aiops/agent-service
  tag: local

replicas: 1

# ANTHROPIC_API_KEY·MCP_API_KEY (infra/k8s/create-secrets.sh) — LLM_MODEL 은 코드 기본값
existingSecret: agent-service-secrets
# CHECKPOINT_DB_URL 조합용 크리덴셜 원천 (postgres 초기화와 같은 Secret)
postgresSecret: postgres-secrets

# K8s 서비스 주소 (compose environment 덮어쓰기의 대응물 — 코드 기본값은 로컬 개발 기준).
# namespace 단일화(8/13 Phase 5 결정 ①)로 전부 같은 ns 평이름 — 관측 스택 이름은
# umbrella 의 fullnameOverride 동결값 (Phase 5 결정 ②)
env:
  prometheusUrl: http://monitoring-kube-prometheus-prometheus:9090
  lokiUrl: http://loki:3100
  mcpServerUrl: http://control-plane:8080/mcp
  kafkaBootstrapServers: kafka:9092

# graceful shutdown 여유 — 체크포인터 재개와 조합 (진행 중 그래프는 재기동 후 체크포인트에서 재개)
terminationGracePeriodSeconds: 60

# Kafka lag 기반 오토스케일링 (Phase 6, ADR-0014) — KEDA CRD 전제라 기본 비활성
keda:
  enabled: false
  minReplicas: 1        # decisions 컨슈머 상주 필요 — scale-to-zero 불가
  maxReplicas: 3        # = ops.incidents 파티션 수 (⑦)
  lagThreshold: 5       # 파티션당 lag 임계 — 초과분만큼 replica 산정
  pollingInterval: 15   # lag 확인 주기(초) — 기본 30, 데모 반응성으로 단축
  cooldownPeriod: 120   # 무부하 지속 시 스케일인까지(초) — 기본 300, 실험 관찰용 단축

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi
