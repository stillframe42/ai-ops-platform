apiVersion: apps/v1
kind: Deployment
metadata:
  name: target-app
  labels:
    {{- include "target-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: target-app
  template:
    metadata:
      labels:
        # app 라벨 = Alloy 의 service 라벨 원천 (LogQL 진입점 계약 — Phase 2 메모)
        app: target-app
    spec:
      containers:
        - name: target-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.javaToolOptions | quote }}
          # Spring Boot 는 KUBERNETES_SERVICE_HOST 감지 시 liveness/readiness 프로브 그룹 자동 활성
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
