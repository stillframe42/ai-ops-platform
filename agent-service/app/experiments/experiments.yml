# A/B 실험 정의 (ADR-0019 실험 층) — 배정은 agent-service 가 incident_id 해시로 한다.
# 첫 variant 가 control. prompt = 프롬프트 레지스트리 버전(app/prompts/analysis/{prompt}.md),
# model_override = LLM 요청에 X-Experiment-Variant 헤더(<name>:<variant>)를 실어 게이트웨이 gateway.yml experiments 정의를 따르게 한다.
# status: active 인 실험 중 첫 번째 하나만 배정한다 — 데모 표본(하루 한 자리 인시던트)이 동시 실험을 감당하지 못한다.
# 종료 시 status: concluded 로 바꾸면 배정이 멈추고 태깅 코드는 그대로 남는다.
experiments:
  # 2026-09-16 종료 (사용자 결정) — 15회차 결과 보류(F +0.03, CI 0 포함, A 11·B 4). 표본을 더 모을 때 active 로 되돌리고 드라이버를 돌린다
  # (docs/experiments/2026-09-16-analysis-prompt-v2.md). 데모 트래픽의 자연 유입만으로는 표본이 모이지 않아 열어 둘 의미가 없다
  - name: analysis-prompt-v2
    target: analysis
    status: concluded
    sample: 1.0
    variants:
      A: {prompt: v1}
      B: {prompt: v2}
  - name: analysis-model-haiku
    target: analysis
    status: concluded
    sample: 1.0
    variants:
      A: {}
      B: {model_override: true}
