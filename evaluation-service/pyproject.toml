[project]
name = "evaluation-service"
version = "0.1.0"
description = "LLM 품질 지속 검증 — ops.analysis.results 샘플링 소비 → 시간창 재조회 → LLM-as-a-Judge (ADR-0019)"
requires-python = ">=3.13"
dependencies = [
    "aiokafka>=0.14.0",
    "fastapi>=0.139",
    "httpx>=0.28.1",
    "opentelemetry-exporter-otlp-proto-http>=1.44",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-sdk>=1.36",
    "pydantic-settings>=2.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
]
